name: Publish

# Publishing is gated on a GitHub Release, not on a push. Tagging is a
# deliberate act; pushing to main is not, and a PyPI version can never be
# reused or overwritten once it exists.
on:
  release:
    types: [published]
  # Manual runs go to TestPyPI only -- a rehearsal that cannot burn a real
  # version number.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      # Catches malformed metadata and an unrenderable README *before* upload.
      # PyPI rejects a bad long_description at upload time, and by then the
      # version number is already spent.
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/promptdrift
    permissions:
      # Required for Trusted Publishing. This is what mints the short-lived
      # OIDC token that PyPI exchanges for upload rights -- there is no API
      # token stored anywhere in this repo.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI accumulates junk from rehearsals; don't fail the run if a
          # version is already up there.
          skip-existing: true

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/promptdrift
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
