[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptdrift"
version = "0.1.0"
description = "Regression testing for LLM prompts. Catch prompt changes that make things worse, before they ship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Jeremie Anand", email = "jerryanand10@gmail.com" }]
keywords = ["llm", "evaluation", "testing", "prompt-engineering", "regression-testing", "ci"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
promptdrift = "promptdrift.cli:main"

[project.urls]
Homepage = "https://github.com/Jeremie2002-sudo/promptdrift"
Issues = "https://github.com/Jeremie2002-sudo/promptdrift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/promptdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
